name: Publish container images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/mrmr888/resilience-lab

jobs:
  publish:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: service-registry
            context: .
            dockerfile: ./Dockerfile
            build_args: MODULE=service-registry
          - service: inventory-service
            context: .
            dockerfile: ./Dockerfile
            build_args: MODULE=inventory-service
          - service: order-service
            context: .
            dockerfile: ./Dockerfile
            build_args: MODULE=order-service
          - service: api-gateway
            context: .
            dockerfile: ./Dockerfile
            build_args: MODULE=api-gateway
          - service: web
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            build_args: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ matrix.service }}-latest
            ${{ env.IMAGE_NAME }}:${{ matrix.service }}-sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=ResilienceLab ${{ matrix.service }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: mode=max
          sbom: true
